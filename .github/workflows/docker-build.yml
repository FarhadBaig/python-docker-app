- name: Login to Docker Hub
  uses: docker/login-action@v4
  with:
    username: farhadbaig
    password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Build Docker image
  run: |
    docker build -t farhadbaig/python-docker-app:latest .

- name: Push Docker image
  run: |
    docker push farhadbaig/python-docker-app:latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/python-docker-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-docker-app:latest
